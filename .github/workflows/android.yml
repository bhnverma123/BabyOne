name: Android CI

on:
  push:
    branches: [ "develop" ]
  # pull_request:
  #   branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew :composeApp:assembleDebug
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
    - name: Distribute to Firebase App Distribution
      run: firebase appdistribution:distribute composeApp/build/outputs/apk/debug/composeApp-debug.apk --app 1:1022334475474:android:6cd7d1910554d22f41610b --testers "bhnverma@gmail.com" --release-notes "Automated distribution from GitHub Actions" --token ${{ secrets.FIREBASE_TOKEN }}
